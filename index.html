<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nara Nails</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Noto+Serif+Armenian:wght@400;500&family=Noto+Sans+Armenian:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f0ea;
    --paper-2: #ede6de;
    --ink: #1f1a17;
    --ink-2: #5d5550;
    --ink-3: #a39a93;
    --rule: #ddd4ca;
    --accent: #8a3b2c;
    --on-ink: #f5f0ea;
    --serif: "Noto Serif Armenian", Georgia, serif;
    --display: "Cormorant Garamond", "Noto Serif Armenian", Georgia, serif;
    --sans: "Noto Sans Armenian", system-ui, -apple-system, sans-serif;
  }
  :root.dark {
    --paper: #171412;
    --paper-2: #211d1a;
    --ink: #eee6dd;
    --ink-2: #b3a89f;
    --ink-3: #6f665f;
    --rule: #332d29;
    --accent: #d08b74;
    --on-ink: #171412;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 22px 110px; }
  .screen { animation: in .35s cubic-bezier(.2,.7,.2,1); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
  .rule { height: 1px; background: var(--rule); border: 0; margin: 0; }
  h2 { font: 500 26px/1.2 var(--serif); margin: 6px 0 22px; letter-spacing: -.01em; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- home ---- */
  .mast { padding: 18px 0 30px; }
  .mark { font: italic 400 58px/0.95 var(--display); letter-spacing: -.01em; margin: 14px 0 0; }
  .mark span { display: block; padding-left: 38px; }
  .tag { margin-top: 18px; color: var(--ink-2); max-width: 260px; }
  .facts { display: flex; gap: 22px; margin-top: 22px; }
  .facts div { font-size: 13px; }
  .facts b { display: block; font-weight: 500; color: var(--ink); }
  .facts span { color: var(--ink-3); }

  .cta { display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: var(--ink); color: var(--on-ink); padding: 18px 20px; border-radius: 2px;
    font-weight: 500; letter-spacing: .02em; transition: opacity .15s; }
  .cta:active { opacity: .85; }
  .cta .arr { font-family: var(--display); font-size: 22px; line-height: 1; }

  .menu { margin-top: 30px; border-top: 1px solid var(--rule); }
  .row { display: flex; align-items: baseline; gap: 14px; width: 100%; padding: 17px 0;
    border-bottom: 1px solid var(--rule); transition: padding .15s; }
  .row:active { padding-left: 6px; }
  .row .n { font: italic 15px var(--display); color: var(--ink-3); width: 18px; }
  .row .l { font: 400 17px var(--serif); }
  .row .r { margin-left: auto; color: var(--ink-3); font-size: 13px; }
  .row .r i { font-style: normal; font-family: var(--display); font-size: 18px; margin-left: 8px; color: var(--ink-2); }

  .booking { border: 1px solid var(--ink); padding: 20px; margin-bottom: 4px; }
  .booking .when { font: 400 22px/1.25 var(--serif); margin: 8px 0 4px; }
  .booking .link { margin-top: 16px; font-size: 13px; color: var(--accent); border-bottom: 1px solid currentColor; }

  /* ---- flow ---- */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .back { font-size: 13px; color: var(--ink-2); }
  .progress { display: flex; gap: 4px; }
  .progress i { width: 18px; height: 2px; background: var(--rule); }
  .progress i.on { background: var(--ink); }

  .svc { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; width: 100%;
    padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .svc:first-of-type { border-top: 1px solid var(--rule); }
  .svc .nm { font: 400 20px var(--serif); }
  .svc .pr { font: 500 17px var(--serif); align-self: end; }
  .svc .du { font-size: 13px; color: var(--ink-3); }
  .svc .go { font-size: 12px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; text-align: right; opacity: 0; transition: opacity .15s; }
  .svc:active .go, .svc:hover .go { opacity: 1; }

  .cal-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .cal-head .m { font: italic 500 26px var(--display); }
  .cal-head .yr { font-style: normal; font-size: 16px; color: var(--ink-3); }
  .mnavs { display: flex; gap: 6px; }
  .mnav { width: 38px; height: 38px; border: 1px solid var(--rule); border-radius: 50%;
    display: grid; place-items: center; font: 18px var(--display); text-align: center; transition: all .15s; }
  .mnav:not([disabled]):active { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .mnav[disabled] { opacity: .3; cursor: default; }
  .inline { color: var(--accent); border-bottom: 1px solid currentColor; font-size: 13px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; margin-top: 12px; }
  .cal .wd { text-align: center; font-size: 11px; color: var(--ink-3); padding: 6px 0 8px; letter-spacing: .04em; }
  .day { aspect-ratio: 1; display: grid; place-items: center; position: relative;
    font: 400 16px var(--serif); font-variant-numeric: tabular-nums; border-radius: 50%; transition: background .15s, color .15s; }
  .day.off { color: var(--ink-3); opacity: .55; cursor: default; }
  .day.today::after { content: ""; position: absolute; bottom: 4px; width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
  .day.sel { background: var(--ink); color: var(--on-ink); }
  .day:not(.off):not(.sel):active { background: var(--paper-2); }
  .note { margin-top: 18px; font-size: 13px; color: var(--ink-3); }

  .slot-group { margin-bottom: 22px; }
  .slot-group .eyebrow { margin-bottom: 10px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot { padding: 11px 0; text-align: center; border: 1px solid var(--rule); border-radius: 2px;
    font-variant-numeric: tabular-nums; transition: all .15s; }
  .slot:active { border-color: var(--ink-2); }
  .slot.sel { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

  .receipt { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 6px 0; }
  .line { display: flex; align-items: baseline; gap: 8px; padding: 12px 0; }
  .line span { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .line .dots { flex: 1; border-bottom: 1px dotted var(--ink-3); transform: translateY(-4px); }
  .line b { font: 400 16px var(--serif); text-align: right; }
  .line.total b { font-size: 20px; font-weight: 500; }

  .price { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .price .nm { font: 400 18px var(--serif); }
  .price .dots { border-bottom: 1px dotted var(--ink-3); transform: translateY(-5px); }
  .price .pr { font: 500 17px var(--serif); }
  .price .du { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); margin-top: -6px; }

  .big { font: 400 30px/1.2 var(--serif); margin: 6px 0 8px; }
  .btn { display: block; width: 100%; padding: 16px; text-align: center; border: 1px solid var(--ink); border-radius: 2px; font-weight: 500; margin-top: 10px; }
  .btn.solid { background: var(--ink); color: var(--on-ink); }

  .banner { display: flex; align-items: center; gap: 12px; padding: 12px 0; margin: -10px 0 18px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
  .banner button { margin-left: auto; color: var(--accent); font-weight: 500; border-bottom: 1px solid currentColor; }
  .empty { padding: 26px 0; color: var(--ink-2); font-size: 14px; }
  .foot { margin-top: 40px; text-align: center; font: italic 15px var(--display); color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);

/* ---------- data from the bot (in ?d=) or demo data for local preview ---------- */
function decode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
const DEMO = {
  g: Date.now(), m: null, days: null, busy: {}, b: null,
  svc: [["gel","Գել-լաք",3000,90],["clean","Մաքրում",1000,45],["fill","Լիցք",5000,150],["pedi","Պեդիկյուր",5000,90]],
  ph: "+374 91 743 389", ig: "nara_nailartist", ad: "ք. Վանաձոր, Զորավար Անդրանիկի 95",
  gm: "https://www.google.com/maps/search/?api=1&query=Vanadzor%2C%20Zoravar%20Andranik%2095",
  ym: "https://yandex.com/maps/?text=Vanadzor%2C%20Zoravar%20Andranik%2095",
};
let D;
try { D = decode(new URLSearchParams(location.search).get("d")); } catch (e) { D = DEMO; }

const MONTHS = ["Հունվար","Փետրվար","Մարտ","Ապրիլ","Մայիս","Հունիս","Հուլիս","Օգոստոս","Սեպտեմբեր","Հոկտեմբեր","Նոյեմբեր","Դեկտեմբեր"];
const MONTHS_GEN = ["հունվարի","փետրվարի","մարտի","ապրիլի","մայիսի","հունիսի","հուլիսի","օգոստոսի","սեպտեմբերի","հոկտեմբերի","նոյեմբերի","դեկտեմբերի"];
const WD = ["Երկ","Երք","Չրք","Հնգ","Ուր","Շբթ","Կիր"];
const WD_LONG = ["երկուշաբթի","երեքշաբթի","չորեքշաբթի","հինգշաբթի","ուրբաթ","շաբաթ","կիրակի"];
const OPEN = 9 * 60, CLOSE = 19 * 60, STEP = 30;
// Free times are baked into the button URL when the bot last sent the menu.
// Older than this -> fetch fresh ones before booking (a just-refreshed snapshot is
// trusted longer, so a phone with a wrong clock can't loop forever).
const STALE_MS = 2 * 60 * 1000, REFRESHED_OK_MS = 30 * 60 * 1000;

/* ---------- time (Asia/Yerevan, same rules as the bot) ---------- */
function nowYerevan() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Yerevan", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { y: +p.year, m: +p.month, d: +p.day, min: +p.hour * 60 + +p.minute };
}
const NOW = nowYerevan();
const pad = n => String(n).padStart(2, "0");
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parseIso = s => s.split("-").map(Number);
const TODAY = iso(NOW.y, NOW.m, NOW.d);
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const addMonth = ({ y, m }, k) => { const t = (y * 12 + m - 1) + k; return { y: Math.floor(t / 12), m: t % 12 + 1 }; };

// Bookable: today through end of next month (same rule as the bot).
const MONTH_VIEWS = [{ y: NOW.y, m: NOW.m }, addMonth({ y: NOW.y, m: NOW.m }, 1)];
if (!D.days) {  // demo data: every day open
  D.days = [];
  for (const { y, m } of MONTH_VIEWS) for (let d = 1; d <= daysIn(y, m); d++) if (iso(y, m, d) >= TODAY) D.days.push(iso(y, m, d));
}
const OPEN_DAYS = new Set(D.days);
const isStale = () => Date.now() - D.g > (D.r ? REFRESHED_OK_MS : STALE_MS);

const hm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const svc = key => { const s = D.svc.find(x => x[0] === key); return { key: s[0], name: s[1], price: s[2], min: s[3] }; };
const dur = min => { const h = Math.floor(min / 60), m = min % 60; return h && m ? `${h},${m * 10 / 60} ժամ` : h ? `${h} ժամ` : `${m} րոպե`; };
const money = n => n.toLocaleString("ru-RU").replace(/\s/g, " ") + " դր.";
const weekday = (y, m, d) => (new Date(y, m - 1, d).getDay() + 6) % 7;
const dateLong = s => { const [y, m, d] = parseIso(s); return `${d} ${MONTHS_GEN[m - 1]}, ${WD_LONG[weekday(y, m, d)]}`; };

// Open the calendar on this month, or next month if this one is full.
function firstView(key) {
  const { y, m } = MONTH_VIEWS[0], min = svc(key).min;
  for (let d = 1; d <= daysIn(y, m); d++) if (starts(iso(y, m, d), min).length) return 0;
  return 1;
}

function starts(day, minutes) {  // day = "YYYY-MM-DD"
  if (!OPEN_DAYS.has(day) || day < TODAY) return [];
  const busy = D.busy[day] || [];
  const out = [];
  for (let s = OPEN; s + minutes <= CLOSE; s += STEP) {
    if (day === TODAY && s <= NOW.min) continue;
    if (busy.every(([b0, b1]) => s + minutes <= b0 || s >= b1)) out.push(s);
  }
  return out;
}

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const state = { screen: "home", svc: null, day: null, time: null, view: 0 };
const haptic = () => tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged && tg.HapticFeedback.selectionChanged();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function send(obj) {
  if (inTelegram) tg.sendData(JSON.stringify(obj));
  else alert("Preview (Telegram-ից դուրս)\n" + JSON.stringify(obj));
}
function openLink(url) { tg && tg.openLink ? tg.openLink(url) : window.open(url, "_blank"); }
function go(screen, patch = {}) { Object.assign(state, patch, { screen }); haptic(); render(); window.scrollTo(0, 0); }

const BACK = { services: "home", calendar: "services", times: "calendar", confirm: "times",
               prices: "home", address: "home", phone: "home" };

function syncTelegram() {
  if (!tg) return;
  if (BACK[state.screen]) tg.BackButton.show(); else tg.BackButton.hide();
  if (state.screen === "confirm") {
    tg.MainButton.setParams({ text: "Հաստատել գրանցումը", color: css("--ink"), text_color: css("--on-ink"), is_visible: true, is_active: true });
  } else tg.MainButton.hide();
}
function confirmBooking() {
  send({ a: "book", s: state.svc, t: `${state.day}T${hm(state.time)}` });
}
if (tg) {
  tg.ready(); tg.expand();
  if (tg.colorScheme === "dark") document.documentElement.classList.add("dark");
  tg.BackButton.onClick(() => go(BACK[state.screen] || "home"));
  tg.MainButton.onClick(confirmBooking);
  const bg = () => { try { tg.setHeaderColor(css("--paper")); tg.setBackgroundColor(css("--paper")); } catch (e) {} };
  bg();
} else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");

const topBar = step => `<div class="top">
    ${inTelegram ? "<span></span>" : `<button class="back" data-go="${BACK[state.screen]}">← Հետ</button>`}
    ${step ? `<div class="progress">${[1,2,3,4].map(i => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>` : ""}
  </div>`;
const stepLabel = (n, t) => `<div class="eyebrow">${pad(n)} — ${t}</div>`;
const staleBanner = () => "";

/* ---------- screens ---------- */
const screens = {
  refreshing() {
    return `<div class="mast"><div class="eyebrow">Մի պահ</div>
      <h2 style="margin-top:14px">Թարմացնում ենք ազատ ժամերը…</h2>
      <p class="muted">Պատուհանը կփակվի։ Հետո կրկին սեղմեք «📅 Գրանցվել» ներքևում։</p></div>`;
  },

  home() {
    const rows = [
      ["prices", "Գներ", `${D.svc.length} ծառայություն`, "→"],
      ["portfolio", "Աշխատանքներ", "լուսանկարներ", "→"],
      ["address", "Հասցե", "Վանաձոր", "→"],
      ["instagram", "Instagram", "@" + D.ig, "↗"],
      ["phone", "Զանգահարել", D.ph, "→"],
    ];
    let lead;
    if (D.b) {
      const s = svc(D.b.s), [d, t] = D.b.t.split("T"), [y, m, dd] = d.split("-").map(Number);
      lead = `<div class="booking">
        <div class="eyebrow">Ձեր գրանցումը</div>
        <div class="when">${dateLong(d)}, ${t}</div>
        <div class="muted">${esc(s.name)} · ${money(s.price)}</div>
        <p class="small muted" style="margin:14px 0 0">Նոր գրանցման համար զանգահարեք՝ ${esc(D.ph)}</p>
        <button class="link" data-act="cancel">Չեղարկել գրանցումը</button>
      </div>`;
    } else {
      lead = `<button class="cta" data-go="services"><span>Գրանցվել այցի</span><span class="arr">→</span></button>`;
    }
    return `
      <div class="mast">
        <div class="eyebrow">Մատնահարդարման ստուդիա · Վանաձոր</div>
        <h1 class="mark">Nara<span>Nails</span></h1>
        <p class="tag">Մանիկյուր, լիցք և պեդիկյուր՝ խնամքով և ուշադրությամբ։</p>
        <div class="facts">
          <div><b>09:00 – 19:00</b><span>ամեն օր</span></div>
          <div><b>Զ. Անդրանիկի 95</b><span>Վանաձոր</span></div>
        </div>
      </div>
      ${lead}
      <div class="menu">
        ${rows.map(([k, l, r, a], i) => `<button class="row" data-nav="${k}">
          <span class="n">${i + 1}</span><span class="l">${l}</span><span class="r">${esc(r)}<i>${a}</i></span>
        </button>`).join("")}
      </div>
      <div class="foot">— Nara —</div>`;
  },

  services() {
    return `${topBar(1)}${stepLabel(1, "Ծառայություն")}<h2>Ի՞նչ ենք անելու</h2>
      ${D.svc.map(([k, n, p, m]) => `
        <button class="svc" data-svc="${k}">
          <span class="nm">${esc(n)}</span><span class="pr num">${money(p)}</span>
          <span class="du">մոտ ${dur(m)}</span><span class="go">Ընտրել</span>
        </button>`).join("")}`;
  },

  calendar() {
    const s = svc(state.svc), { y, m } = MONTH_VIEWS[state.view];
    let cells = WD.map(w => `<div class="wd">${w}</div>`).join("") + "<div></div>".repeat(weekday(y, m, 1));
    let any = false;
    for (let d = 1; d <= daysIn(y, m); d++) {
      const key = iso(y, m, d), ok = starts(key, s.min).length > 0; any ||= ok;
      cells += `<button class="day ${ok ? "" : "off"} ${key === TODAY ? "today" : ""} ${state.day === key ? "sel" : ""}" ${ok ? `data-day="${key}"` : "disabled"}>${d}</button>`;
    }
    const nav = (k, label) => {
      const target = state.view + k, ok = target >= 0 && target < MONTH_VIEWS.length;
      return `<button class="mnav" ${ok ? `data-view="${target}"` : "disabled"} aria-label="${label}">${k < 0 ? "←" : "→"}</button>`;
    };
    const other = MONTH_VIEWS[1 - state.view];
    return `${topBar(2)}${staleBanner()}${stepLabel(2, "Օր")}<h2>Ո՞ր օրը</h2>
      <div class="cal-head">
        <span class="m">${MONTHS[m - 1]}${y !== NOW.y ? ` <span class="yr">${y}</span>` : ""}</span>
        <span class="mnavs">${nav(-1, "Նախորդ ամիս")}${nav(1, "Հաջորդ ամիս")}</span>
      </div>
      <div class="cal">${cells}</div>
      <p class="note">${any ? `Գունատ օրերին ազատ ժամ չկա։ ${state.view === 0 ? "Հաջորդ ամիսը՝ →" : ""}`
        : `${MONTHS[m - 1]}ին ազատ օրեր չկան։ <button class="inline" data-view="${1 - state.view}">Դիտել ${MONTHS_GEN[other.m - 1].replace(/ի$/, "ը")}</button>`}</p>
      <p class="note">${esc(s.name)} · մոտ ${dur(s.min)}</p>`;
  },

  times() {
    const s = svc(state.svc), list = starts(state.day, s.min);
    const groups = [["Առավոտ", t => t < 720], ["Կեսօր", t => t >= 720 && t < 900], ["Երեկո", t => t >= 900]];
    const body = groups.map(([label, f]) => {
      const ts = list.filter(f);
      return ts.length ? `<div class="slot-group"><div class="eyebrow">${label}</div><div class="slots">
        ${ts.map(t => `<button class="slot ${state.time === t ? "sel" : ""}" data-time="${t}">${hm(t)}</button>`).join("")}
      </div></div>` : "";
    }).join("");
    return `${topBar(3)}${staleBanner()}${stepLabel(3, "Ժամ")}<h2>Ո՞ր ժամին</h2>
      <p class="small muted" style="margin:-12px 0 22px">${dateLong(state.day)}</p>
      ${body || `<div class="empty">Այս օրը ազատ ժամեր այլևս չկան։</div>`}`;
  },

  confirm() {
    const s = svc(state.svc);
    const line = (k, v, cls = "") => `<div class="line ${cls}"><span>${k}</span><i class="dots"></i><b>${v}</b></div>`;
    return `${topBar(4)}${stepLabel(4, "Հաստատում")}<h2>Ամեն ինչ ճի՞շտ է</h2>
      <div class="receipt">
        ${line("Ծառայություն", esc(s.name))}
        ${line("Օր", dateLong(state.day))}
        ${line("Ժամ", `<span class="num">${hm(state.time)} – ${hm(state.time + s.min)}</span>`)}
        ${line("Արժեք", `<span class="num">${money(s.price)}</span>`, "total")}
      </div>
      <p class="small muted" style="margin-top:18px">Հաստատելուց հետո բոտը կխնդրի ձեր հեռախոսահամարը։</p>
      ${inTelegram ? "" : `<button class="btn solid" data-act="confirm">Հաստատել գրանցումը</button>`}`;
  },

  prices() {
    return `${topBar(0)}<div class="eyebrow">Գնացուցակ</div><h2>Գներ</h2>
      ${D.svc.map(([k, n, p, m]) => `<div class="price">
        <span class="nm">${esc(n)}</span><i class="dots"></i><span class="pr num">${money(p)}</span>
        <span class="du">մոտ ${dur(m)}</span></div>`).join("")}
      ${D.b ? "" : `<button class="btn solid" data-go="services" style="margin-top:28px">Գրանցվել այցի</button>`}`;
  },

  address() {
    return `${topBar(0)}<div class="eyebrow">Ինչպես գտնել</div><h2>Հասցե</h2>
      <div class="big">${esc(D.ad)}</div>
      <p class="muted small">Ընդունում ենք ամեն օր՝ 09:00-ից 19:00</p>
      <div style="margin-top:28px">
        <button class="btn solid" data-link="${esc(D.gm)}">Բացել Google Maps-ում</button>
        <button class="btn" data-link="${esc(D.ym)}">Բացել Yandex Maps-ում</button>
      </div>`;
  },

  phone() {
    const tel = D.ph.replace(/[^\d+]/g, "");
    return `${topBar(0)}<div class="eyebrow">Կապ վարպետի հետ</div><h2>Զանգահարել</h2>
      <div class="big num">${esc(D.ph)}</div>
      <p class="muted small">Զանգահարեք նաև, եթե ցանկանում եք գրանցվել հաջորդ ամսվա համար։</p>
      <div style="margin-top:28px">
        <a class="btn solid" href="tel:${tel}">Զանգահարել</a>
        <button class="btn" data-act="copy">Պատճենել համարը</button>
      </div>`;
  },
};

function render() {
  app.innerHTML = `<div class="screen">${screens[state.screen]()}</div>`;
  syncTelegram();
}

app.addEventListener("click", e => {
  const el = e.target.closest("button, a"); if (!el || el.disabled) return;
  const ds = el.dataset;
  if (ds.go === "services" && isStale()) { go("refreshing"); setTimeout(() => send({ a: "refresh" }), 400); }
  else if (ds.go) go(ds.go);
  else if (ds.nav === "portfolio") send({ a: "portfolio" });
  else if (ds.nav === "instagram") openLink("https://instagram.com/" + D.ig);
  else if (ds.nav) go(ds.nav);
  else if (ds.view !== undefined) go("calendar", { view: +ds.view });
  else if (ds.svc) go("calendar", { svc: ds.svc, day: null, time: null, view: firstView(ds.svc) });
  else if (ds.day) go("times", { day: ds.day, time: null });
  else if (ds.time) go("confirm", { time: +ds.time });
  else if (ds.link) openLink(ds.link);
  else if (ds.act === "confirm") confirmBooking();
  else if (ds.act === "refresh") send({ a: "refresh" });
  else if (ds.act === "cancel") {
    const ask = "Չեղարկե՞լ գրանցումը";
    if (tg && tg.showConfirm && inTelegram) tg.showConfirm(ask, ok => ok && send({ a: "cancel" }));
    else if (confirm(ask)) send({ a: "cancel" });
  } else if (ds.act === "copy") {
    navigator.clipboard && navigator.clipboard.writeText(D.ph);
    inTelegram ? tg.showAlert("Համարը պատճենված է") : alert("Համարը պատճենված է");
  }
});

render();
</script>
</body>
</html>
